[project]
name = "whisper"
version = "0.1.0"
description = "Whisper - calcul de trim avion (classe singleton), outil autonome sans dependance tierce"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Facultatif : uniquement pour examples/example_sweep_dagster.py (le coeur
# du package whisper reste sans dependance tierce). pip install .[dagster]
dagster = ["dagster>=1.8,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["whisper*"]
