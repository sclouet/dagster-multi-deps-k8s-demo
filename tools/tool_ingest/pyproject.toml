[project]
name = "tool-ingest"
version = "0.1.0"
description = "Outil d'ingestion - stack legacy (pandas 1.5.3) - code location Dagster isolee"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pandas==1.5.3",
    "numpy<2",
    "dagster==1.8.13",
    "dagster-aws==0.24.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tool_ingest*"]
