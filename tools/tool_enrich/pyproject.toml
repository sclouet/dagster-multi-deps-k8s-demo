[project]
name = "tool-enrich"
version = "0.1.0"
description = "Outil d'enrichissement - stack moderne (pandas 2.2.2, pydantic v2) - code location Dagster isolee"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==2.2.2",
    "numpy>=1.26,<2",
    "pydantic>=2,<3",
    "dagster==1.8.13",
    "dagster-aws==0.24.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tool_enrich*"]
