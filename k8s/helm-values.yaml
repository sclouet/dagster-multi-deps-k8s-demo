# values.yaml pour le chart officiel "dagster/dagster".
# https://github.com/dagster-io/dagster/tree/master/helm/dagster
#
# Usage :
#   helm repo add dagster https://dagster-io.github.io/helm
#   helm repo update
#   helm install demo dagster/dagster \
#     -f k8s/helm-values.yaml \
#     -f k8s/dagster-instance-values.yaml
#
# Le sous-chart "dagster-user-deployments" fait tourner chacun de nos 3
# outils dans son propre pod, avec sa propre image (donc ses propres
# dependances) ; le webserver/daemon principal du chart les decouvre
# automatiquement a partir de cette liste (pas besoin de workspace.yaml
# manuel comme en docker-compose).
#
# NB : le schema exact des cles peut evoluer d'une version du chart a
# l'autre. Avant un vrai `helm install`, verifier avec :
#   helm show values dagster/dagster > /tmp/dagster-chart-values.yaml

dagster-user-deployments:
  enabled: true
  deployments:
    - name: "tool-ingest"
      image:
        repository: "dagster-demo/tool-ingest"
        tag: "local"
        pullPolicy: IfNotPresent
      dagsterApiGrpcArgs: ["-m", "tool_ingest.definitions"]
      port: 3030
      env: &minio_env
        - name: DAGSTER_S3_ENDPOINT
          value: "http://minio.default.svc.cluster.local:9000"
        - name: DAGSTER_S3_ACCESS_KEY
          value: "dagster"
        - name: DAGSTER_S3_SECRET_KEY
          value: "dagster123"
        - name: DAGSTER_S3_BUCKET
          value: "dagster-demo"

    - name: "tool-enrich"
      image:
        repository: "dagster-demo/tool-enrich"
        tag: "local"
        pullPolicy: IfNotPresent
      dagsterApiGrpcArgs: ["-m", "tool_enrich.definitions"]
      port: 3030
      env: *minio_env

    - name: "tool-score"
      image:
        repository: "dagster-demo/tool-score"
        tag: "local"
        pullPolicy: IfNotPresent
      dagsterApiGrpcArgs: ["-m", "tool_score.definitions"]
      port: 3030
      env: *minio_env
